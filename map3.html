<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Map with Country Points</title>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
  body { margin: 0; background: #000; }
  #map { height: 100vh; width: 100%; }

  .country-label {
    color: #ff5555;
    font-size: 14px;
    font-weight: bold;
    text-shadow: 1px 1px 2px black;
  }

  .leaflet-control-layers {
    background: rgba(20, 20, 20, 0.8);
    border-radius: 10px;
    color: white;
  }
</style>
</head>
<body>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Fullscreen plugin -->
<script src="https://api.mapbox.com/mapbox.js/plugins/leaflet-fullscreen/v1.0.1/Leaflet.fullscreen.min.js"></script>
<link href="https://api.mapbox.com/mapbox.js/plugins/leaflet-fullscreen/v1.0.1/leaflet.fullscreen.css" rel="stylesheet" />

<script>
// Initialize 2D Map
var map = L.map('map', {
  center: [20, 0],
  zoom: 2,
  fullscreenControl: true
});

// Base Layers
var normal = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

var satellite = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
  maxZoom: 20,
  subdomains:['mt0','mt1','mt2','mt3']
});

// Layer control
L.control.layers({
  "Normal": normal,
  "Satellite": satellite
}).addTo(map);

// Country data (few examples)
var countries = [
  { name: "India", lat: 20.5937, lon: 78.9629 },
  { name: "United States", lat: 37.0902, lon: -95.7129 },
  { name: "United Kingdom", lat: 55.3781, lon: -3.4360 },
  { name: "Japan", lat: 36.2048, lon: 138.2529 },
  { name: "Australia", lat: -25.2744, lon: 133.7751 },
  { name: "Brazil", lat: -14.2350, lon: -51.9253 },
  { name: "South Africa", lat: -30.5595, lon: 22.9375 },
];

// Add red markers and labels
countries.forEach(c => {
  // Red marker
  var marker = L.circleMarker([c.lat, c.lon], {
    color: "#ff3333",
    radius: 6,
    fillColor: "#ff3333",
    fillOpacity: 1
  }).addTo(map);

  // Permanent label (without hover)
  var label = L.divIcon({
    className: "country-label",
    html: c.name,
    iconSize: [60, 20]
  });
  L.marker([c.lat + 2, c.lon], { icon: label }).addTo(map);
});
</script>

</body>
</html>
